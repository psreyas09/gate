<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="GATE CSE 2027 High-Yield Strategy &amp; Practice Platform" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>GATE CSE 2027 — High-Yield Prep Platform</title>
    <script>
      // Capture phase error listener to detect <script> and module load failures
      window.addEventListener('error', function(e) {
        var target = e.target || e.srcElement;
        var isScriptOrLink = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
        var msg = String(e.message || (e.error && e.error.message) || '');
        var isMimeOrModule = msg.indexOf('Failed to load module script') !== -1 || msg.indexOf('text/html') !== -1;

        if (isScriptOrLink || isMimeOrModule) {
          console.warn('[GATE Auto-Recovery] Stale build assets detected. Unregistering SW and clearing caches...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) regs[i].unregister();
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
            });
          }
          // Avoid infinite refresh loop by checking session timestamp
          var lastReload = sessionStorage.getItem('gate_last_self_heal');
          if (!lastReload || Date.now() - Number(lastReload) > 8000) {
            sessionStorage.setItem('gate_last_self_heal', String(Date.now()));
            setTimeout(function() { window.location.reload(); }, 200);
          }
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        console.error('[GATE Global Rejection]', e.reason);
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update().catch(() => {});
          }).catch((err) => console.log('SW registration skipped:', err));
        });
      }
    </script>
  </body>
</html>
